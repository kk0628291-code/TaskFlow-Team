<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Mes projets</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f1f5f9;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .navbar {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            padding: 16px 30px;
            border-radius: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .navbar h2 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-danger { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .project-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .project-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin: 10px 0;
        }
        .status-actif { background: rgba(16,185,129,0.2); color: #34d399; }
        .status-pause { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .status-archive { background: rgba(107,114,128,0.2); color: #9ca3af; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 24px;
            width: 500px;
            max-width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-content h3 { margin-bottom: 20px; color: #c084fc; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 12px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .page-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            color: #94a3b8;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
        }
        .page-btn.active { background: #4f46e5; color: white; }
        .logout-btn { background: linear-gradient(135deg, #dc2626, #b91c1c); margin-left: 10px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .back-btn { margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <h2>TaskFlow</h2>
        <div class="user-info">
            <span id="userName"></span>
            <button class="btn logout-btn" onclick="logout()">Déconnexion</button>
        </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; background-clip: text; color: transparent;">📁 Mes projets</h1>
        <button class="btn" onclick="openModal()">+ Nouveau projet</button>
    </div>

    <div id="projectsList">Chargement...</div>
    <div id="pagination" class="pagination"></div>
    
    <div class="back-btn">
        <button class="btn" onclick="window.location.href='dashboard.html'">🏠 Retour au Dashboard</button>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Nouveau projet</h3>
        <input type="text" id="projectTitle" placeholder="Titre du projet">
        <textarea id="projectDesc" placeholder="Description" rows="3"></textarea>
        <input type="date" id="projectDueDate">
        <select id="projectStatus">
            <option value="actif">Actif</option>
            <option value="en pause">En pause</option>
            <option value="archivé">Archivé</option>
        </select>
        <input type="hidden" id="projectId">
        <button class="btn" onclick="saveProject()" style="width:100%; margin-top:10px;">Enregistrer</button>
        <button class="btn" onclick="closeModal()" style="width:100%; margin-top:10px; background: #334155;">Annuler</button>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:5000/api';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'auth.html';

    let currentPage = 1, totalPages = 1;

    axios.interceptors.request.use(config => {
        config.headers.Authorization = `Bearer ${token}`;
        return config;
    });

    async function loadUser() {
        try {
            const res = await axios.get(`${API_URL}/auth/me`);
            document.getElementById('userName').textContent = res.data.fullName || res.data.email;
        } catch (error) {
            localStorage.removeItem('token');
            window.location.href = 'auth.html';
        }
    }

    async function loadProjects(page = 1) {
        try {
            const res = await axios.get(`${API_URL}/projects?page=${page}&limit=6`);
            const { data, totalPages: pages, page: current } = res.data;
            totalPages = pages;
            currentPage = current;
            const container = document.getElementById('projectsList');
            if (!data || !data.length) {
                container.innerHTML = '<div style="text-align:center; padding:40px;">✨ Aucun projet. Créez votre premier projet !</div>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            container.innerHTML = data.map(p => `
                <div class="project-card">
                    <div class="project-title">${escapeHtml(p.title)}</div>
                    <div class="status-badge status-${p.status}">${p.status}</div>
                    <p>${escapeHtml(p.description || 'Aucune description')}</p>
                    <p>📅 ${p.dueDate ? new Date(p.dueDate).toLocaleDateString() : 'Pas de date limite'}</p>
                    <button class="btn" onclick="editProject('${p._id}')" style="margin-right:10px;">Modifier</button>
                    <button class="btn btn-danger" onclick="deleteProject('${p._id}')">Supprimer</button>
                </div>
            `).join('');
            renderPagination();
        } catch (error) {
            document.getElementById('projectsList').innerHTML = '<div style="text-align:center; padding:40px;">❌ Erreur de chargement</div>';
        }
    }

    function renderPagination() {
        const container = document.getElementById('pagination');
        if (totalPages <= 1) { container.innerHTML = ''; return; }
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="loadProjects(${i})">${i}</button>`;
        }
        container.innerHTML = html;
    }

    async function saveProject() {
        const id = document.getElementById('projectId').value;
        const data = {
            title: document.getElementById('projectTitle').value,
            description: document.getElementById('projectDesc').value,
            dueDate: document.getElementById('projectDueDate').value || null,
            status: document.getElementById('projectStatus').value
        };
        if (!data.title) return alert('Le titre est requis');
        try {
            if (id) await axios.put(`${API_URL}/projects/${id}`, data);
            else await axios.post(`${API_URL}/projects`, data);
            closeModal();
            loadProjects(currentPage);
        } catch (err) { alert(err.response?.data?.message || 'Erreur'); }
    }

    async function editProject(id) {
        try {
            const res = await axios.get(`${API_URL}/projects/${id}`);
            const p = res.data;
            document.getElementById('modalTitle').textContent = 'Modifier le projet';
            document.getElementById('projectId').value = p._id;
            document.getElementById('projectTitle').value = p.title;
            document.getElementById('projectDesc').value = p.description || '';
            document.getElementById('projectDueDate').value = p.dueDate ? p.dueDate.split('T')[0] : '';
            document.getElementById('projectStatus').value = p.status;
            document.getElementById('modal').classList.add('active');
        } catch (err) { alert('Erreur'); }
    }

    async function deleteProject(id) {
        if (!confirm('Supprimer ce projet ?')) return;
        try {
            await axios.delete(`${API_URL}/projects/${id}`);
            loadProjects(currentPage);
        } catch (err) { alert('Erreur'); }
    }

    function openModal() {
        document.getElementById('modalTitle').textContent = 'Nouveau projet';
        document.getElementById('projectId').value = '';
        document.getElementById('projectTitle').value = '';
        document.getElementById('projectDesc').value = '';
        document.getElementById('projectDueDate').value = '';
        document.getElementById('projectStatus').value = 'actif';
        document.getElementById('modal').classList.add('active');
    }

    function closeModal() { document.getElementById('modal').classList.remove('active'); }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'auth.html';
    }

    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

    loadUser();
    loadProjects();
</script>
</body>
</html>
