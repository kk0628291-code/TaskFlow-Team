<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Authentification</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .logo { text-align: center; margin-bottom: 35px; }
        .logo h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p { color: #94a3b8; font-size: 14px; margin-top: 8px; }
        .form-box h2 { font-size: 24px; font-weight: 600; color: #f1f5f9; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            font-size: 15px;
            color: #f1f5f9;
            transition: all 0.3s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129,140,248,0.2);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .toggle-link { text-align: center; margin-top: 20px; }
        .toggle-link p { color: #94a3b8; font-size: 14px; cursor: pointer; }
        .toggle-link p:hover { color: #a78bfa; }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .message.success { background: rgba(34,197,94,0.2); color: #4ade80; display: block; }
        .message.error { background: rgba(239,68,68,0.2); color: #f87171; display: block; }
        .hidden { display: none; }
        .dashboard-header { text-align: center; margin-bottom: 30px; }
        .avatar {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 40px;
        }
        .welcome-text { font-size: 18px; color: #f1f5f9; margin-bottom: 5px; }
        .email-text { font-size: 13px; color: #94a3b8; }
        .profile-card {
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            margin: 25px 0;
        }
        .profile-info {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }
        .profile-info:last-child { border-bottom: none; }
        .profile-label { color: #94a3b8; font-size: 13px; }
        .profile-value { color: #f1f5f9; font-weight: 500; }
        .btn-logout {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
        }
    </style>
</head>
<body>
<div class="glass-card">
    <div class="logo">
        <h1>TaskFlow</h1>
        <p>Gestion de projets collaborative</p>
    </div>

    <!-- INSCRIPTION -->
    <div id="registerBox" class="form-box">
        <h2>✨ Créer un compte</h2>
        <div class="input-group"><input type="text" id="fullName" placeholder="Nom complet"></div>
        <div class="input-group"><input type="email" id="regEmail" placeholder="Email"></div>
        <div class="input-group"><input type="password" id="regPassword" placeholder="Mot de passe (min. 6)"></div>
        <button class="btn" id="registerBtn">S'inscrire</button>
        <div class="toggle-link"><p onclick="showLogin()">Déjà un compte ? Se connecter</p></div>
        <div id="regMsg" class="message"></div>
    </div>

    <!-- CONNEXION -->
    <div id="loginBox" class="form-box hidden">
        <h2>🔐 Connexion</h2>
        <div class="input-group"><input type="email" id="loginEmail" placeholder="Email"></div>
        <div class="input-group"><input type="password" id="loginPassword" placeholder="Mot de passe"></div>
        <button class="btn" id="loginBtn">Se connecter</button>
        <div class="toggle-link"><p onclick="showRegister()">Pas encore de compte ? S'inscrire</p></div>
        <div id="loginMsg" class="message"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
        <div class="dashboard-header">
            <div class="avatar">👤</div>
            <div class="welcome-text">Bienvenue, <strong><span id="user"></span></strong></div>
            <div class="email-text" id="userEmail"></div>
        </div>
        <div class="profile-card">
            <div class="profile-info"><span class="profile-label">ID</span><span class="profile-value" id="userId">-</span></div>
            <div class="profile-info"><span class="profile-label">Email</span><span class="profile-value" id="profileEmail">-</span></div>
            <div class="profile-info"><span class="profile-label">Membre depuis</span><span class="profile-value" id="memberSince">-</span></div>
        </div>
        <button class="btn btn-logout" onclick="logout()">Déconnexion</button>
    </div>
</div>

<script>
    const API = axios.create({ baseURL: 'http://localhost:5000/api/auth', timeout: 5000 });
    API.interceptors.request.use(config => {
        const token = localStorage.getItem('token');
        if (token) config.headers.Authorization = `Bearer ${token}`;
        return config;
    });

    function showLogin() {
        document.getElementById('registerBox').classList.add('hidden');
        document.getElementById('loginBox').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
    }
    function showRegister() {
        document.getElementById('registerBox').classList.remove('hidden');
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('dashboard').classList.add('hidden');
    }
    function showDashboard(user) {
        document.getElementById('registerBox').classList.add('hidden');
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('user').textContent = user.fullName;
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('userId').textContent = user.id;
        document.getElementById('profileEmail').textContent = user.email;
        document.getElementById('memberSince').textContent = new Date().toLocaleDateString();
    }
    function showMessage(elementId, msg, type) {
        const div = document.getElementById(elementId);
        div.textContent = msg;
        div.className = `message ${type}`;
        setTimeout(() => div.style.display = 'none', 4000);
    }
    async function register() {
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        if (!fullName || !email || !password) return showMessage('regMsg', 'Tous les champs requis', 'error');
        if (password.length < 6) return showMessage('regMsg', 'Mot de passe min. 6 caractères', 'error');
        try {
            const res = await API.post('/register', { fullName, email, password });
            if (res.data.token) {
                localStorage.setItem('token', res.data.token);
                localStorage.setItem('user', JSON.stringify(res.data.user));
                showMessage('regMsg', '✅ Inscription réussie !', 'success');
                setTimeout(() => showDashboard(res.data.user), 1500);
            }
        } catch (err) {
            showMessage('regMsg', err.response?.data?.message || 'Erreur', 'error');
        }
    }
    async function login() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) return showMessage('loginMsg', 'Tous les champs requis', 'error');
        try {
            const res = await API.post('/login', { email, password });
            if (res.data.token) {
                localStorage.setItem('token', res.data.token);
                localStorage.setItem('user', JSON.stringify(res.data.user));
                showMessage('loginMsg', '✅ Connexion réussie !', 'success');
                setTimeout(() => showDashboard(res.data.user), 1500);
            }
        } catch (err) {
            showMessage('loginMsg', err.response?.data?.message || 'Email ou mot de passe incorrect', 'error');
        }
    }
    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        showRegister();
    }
    async function checkSession() {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (token && user.fullName) {
            try { await API.get('/me'); showDashboard(user); }
            catch(e) { localStorage.removeItem('token'); localStorage.removeItem('user'); showRegister(); }
        } else showRegister();
    }
    document.getElementById('registerBtn').onclick = register;
    document.getElementById('loginBtn').onclick = login;
    checkSession();
</script>
</body>
</html>
