<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gestion des tâches</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f1f5f9;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .navbar {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            padding: 16px 30px;
            border-radius: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .navbar h2 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card h2 { margin-bottom: 20px; color: #c084fc; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 12px;
        }
        .member-section {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .member-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .member-tag {
            background: rgba(139,92,246,0.3);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .remove-member { background: none; border: none; color: #f87171; cursor: pointer; }
        .add-member { display: flex; gap: 10px; margin-top: 15px; }
        .add-member input { flex: 1; }
        .add-member button { width: auto; padding: 12px 20px; }
        .task-item {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #818cf8;
        }
        .task-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .task-priority {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-right: 10px;
        }
        .priority-haute { background: rgba(239,68,68,0.2); color: #f87171; }
        .priority-moyenne { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .priority-basse { background: rgba(16,185,129,0.2); color: #34d399; }
        .assigned-badge {
            background: rgba(139,92,246,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-left: 10px;
        }
        .task-status {
            margin-top: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 6px;
        }
        .logout-btn { background: linear-gradient(135deg, #dc2626, #b91c1c); margin-left: 10px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .back-btn { margin-top: 20px; }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .page-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            color: #94a3b8;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
        }
        .page-btn.active { background: #4f46e5; color: white; }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <h2>TaskFlow</h2>
        <div class="user-info">
            <span id="userName"></span>
            <button class="btn logout-btn" onclick="logout()">Déconnexion</button>
        </div>
    </div>

    <div class="card">
        <h2>📁 Sélectionner un projet</h2>
        <select id="projectSelect">
            <option value="">-- Choisissez un projet --</option>
        </select>
    </div>

    <div id="memberSection" class="member-section" style="display: none;">
        <h3>👥 Membres du projet</h3>
        <div id="membersList" class="member-list"></div>
        <div class="add-member">
            <input type="email" id="inviteEmail" placeholder="Email du membre à inviter">
            <button class="btn" onclick="addMember()">➕ Inviter</button>
        </div>
    </div>

    <div class="card">
        <h2>✨ Nouvelle tâche</h2>
        <div class="form-group"><label>Titre</label><input type="text" id="taskTitle" placeholder="Titre"></div>
        <div class="form-group"><label>Description</label><textarea id="taskDesc" rows="3"></textarea></div>
        <div class="form-group"><label>Priorité</label><select id="taskPriority"><option value="basse">Basse</option><option value="moyenne" selected>Moyenne</option><option value="haute">Haute</option></select></div>
        <div class="form-group"><label>Statut</label><select id="taskStatus"><option value="à faire">À faire</option><option value="en cours">En cours</option><option value="terminé">Terminé</option></select></div>
        <div class="form-group"><label>👥 Assigner à</label><select id="assignedTo"><option value="">-- Non assigné --</option></select></div>
        <div class="form-group"><label>Date limite</label><input type="date" id="dueDate"></div>
        <button class="btn" onclick="createTask()" style="width:100%">✅ Créer la tâche</button>
        <div id="message" style="margin-top:15px; text-align:center;"></div>
    </div>

    <div class="card">
        <h2>📋 Liste des tâches</h2>
        <div id="tasksList">Chargement...</div>
        <div id="pagination" class="pagination"></div>
    </div>

    <div class="back-btn">
        <button class="btn" onclick="window.location.href='dashboard.html'">🏠 Retour au Dashboard</button>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:5000/api';
    const token = localStorage.getItem('token');
    const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token) window.location.href = 'auth.html';

    let currentProjectId = null, currentPage = 1, totalPages = 1;

    axios.interceptors.request.use(config => {
        config.headers.Authorization = `Bearer ${token}`;
        return config;
    });

    // ========== FONCTIONNALITÉ 7 – BROUILLONS ==========
    function saveDraft() {
        if (!currentProjectId) return;
        const draft = {
            title: document.getElementById('taskTitle').value,
            description: document.getElementById('taskDesc').value,
            priority: document.getElementById('taskPriority').value,
            status: document.getElementById('taskStatus').value,
            assignedTo: document.getElementById('assignedTo').value,
            dueDate: document.getElementById('dueDate').value
        };
        if (!draft.title && !draft.description && !draft.dueDate && !draft.assignedTo) {
            localStorage.removeItem(`task_draft_${currentProjectId}`);
            return;
        }
        localStorage.setItem(`task_draft_${currentProjectId}`, JSON.stringify(draft));
    }

    function loadDraft() {
        if (!currentProjectId) return false;
        const raw = localStorage.getItem(`task_draft_${currentProjectId}`);
        if (!raw) return false;
        try {
            const draft = JSON.parse(raw);
            document.getElementById('taskTitle').value = draft.title || '';
            document.getElementById('taskDesc').value = draft.description || '';
            document.getElementById('taskPriority').value = draft.priority || 'moyenne';
            document.getElementById('taskStatus').value = draft.status || 'à faire';
            if (draft.assignedTo) document.getElementById('assignedTo').value = draft.assignedTo;
            document.getElementById('dueDate').value = draft.dueDate || '';
            return true;
        } catch(e) { return false; }
    }

    function clearDraft() {
        if (currentProjectId) localStorage.removeItem(`task_draft_${currentProjectId}`);
    }

    function promptRestoreDraft() {
        if (!currentProjectId) return;
        if (localStorage.getItem(`task_draft_${currentProjectId}`)) {
            if (confirm('🔄 Un brouillon non terminé existe. Voulez-vous le restaurer ?')) {
                loadDraft();
            } else {
                clearDraft();
            }
        }
    }

    function initDraftAutoSave() {
        const fields = ['taskTitle', 'taskDesc', 'taskPriority', 'taskStatus', 'assignedTo', 'dueDate'];
        fields.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', () => saveDraft());
        });
    }

    async function loadUser() {
        try {
            const res = await axios.get(`${API_URL}/auth/me`);
            document.getElementById('userName').textContent = res.data.fullName || res.data.email;
        } catch (error) {
            localStorage.removeItem('token');
            window.location.href = 'auth.html';
        }
    }

    async function loadProjects() {
        try {
            const res = await axios.get(`${API_URL}/projects?limit=100`);
            const select = document.getElementById('projectSelect');
            select.innerHTML = '<option value="">-- Choisissez un projet --</option>';
            res.data.data.forEach(project => {
                const opt = document.createElement('option');
                opt.value = project._id;
                opt.textContent = project.title;
                select.appendChild(opt);
            });
        } catch (error) { console.error(error); }
    }

    async function loadMembers(projectId) {
        try {
            const res = await axios.get(`${API_URL}/tasks/projects/${projectId}/members`);
            const data = res.data;
            const isOwner = data.owner && data.owner._id === currentUser.id;
            document.getElementById('memberSection').style.display = isOwner ? 'block' : 'none';
            const assignSelect = document.getElementById('assignedTo');
            assignSelect.innerHTML = '<option value="">-- Non assigné --</option>';
            if (data.owner) assignSelect.appendChild(new Option(`${data.owner.fullName} (Propriétaire)`, data.owner._id));
            if (data.members) data.members.forEach(m => assignSelect.appendChild(new Option(m.fullName, m._id)));
            if (isOwner && data.owner) {
                const membersList = document.getElementById('membersList');
                membersList.innerHTML = `<div class="member-tag">👑 ${data.owner.fullName}</div>`;
                if (data.members) data.members.forEach(m => {
                    membersList.innerHTML += `<div class="member-tag">👤 ${m.fullName} <button class="remove-member" onclick="removeMember('${m._id}')">✕</button></div>`;
                });
            }
            // 👈 Restauration du brouillon après chargement des membres
            promptRestoreDraft();
        } catch (error) { console.error(error); }
    }

    async function addMember() {
        const email = document.getElementById('inviteEmail').value.trim();
        if (!email) return alert('Email requis');
        try {
            await axios.post(`${API_URL}/tasks/projects/${currentProjectId}/members`, { email });
            alert('✅ Membre ajouté');
            document.getElementById('inviteEmail').value = '';
            loadMembers(currentProjectId);
        } catch (error) { alert(error.response?.data?.message || 'Erreur'); }
    }

    async function removeMember(memberId) {
        if (!confirm('Retirer ce membre ?')) return;
        try {
            await axios.delete(`${API_URL}/tasks/projects/${currentProjectId}/members/${memberId}`);
            loadMembers(currentProjectId);
        } catch (error) { alert('Erreur'); }
    }

    async function loadTasks(page = 1) {
        if (!currentProjectId) {
            document.getElementById('tasksList').innerHTML = '<p>Sélectionnez un projet</p>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        try {
            const res = await axios.get(`${API_URL}/tasks?projectId=${currentProjectId}&page=${page}&limit=5`);
            const tasks = res.data.data || [];
            totalPages = res.data.totalPages || 1;
            currentPage = res.data.page || 1;
            const container = document.getElementById('tasksList');
            if (!tasks.length) {
                container.innerHTML = '<p>Aucune tâche dans ce projet</p>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            container.innerHTML = tasks.map(task => `
                <div class="task-item">
                    <div class="task-title">${escapeHtml(task.title)}</div>
                    <div>
                        <span class="task-priority priority-${task.priority}">${task.priority}</span>
                        ${task.assignedTo ? `<span class="assigned-badge">👤 ${task.assignedTo.fullName}</span>` : '<span class="assigned-badge">📌 Non assigné</span>'}
                    </div>
                    <p>${escapeHtml(task.description || 'Pas de description')}</p>
                    <div>
                        <select onchange="updateStatus('${task._id}', this.value)" class="task-status">
                            <option value="à faire" ${task.status === 'à faire' ? 'selected' : ''}>À faire</option>
                            <option value="en cours" ${task.status === 'en cours' ? 'selected' : ''}>En cours</option>
                            <option value="terminé" ${task.status === 'terminé' ? 'selected' : ''}>Terminé</option>
                        </select>
                    </div>
                    <small>📅 ${task.dueDate ? new Date(task.dueDate).toLocaleDateString() : 'Pas de date'}</small>
                </div>
            `).join('');
            renderPagination();
        } catch (error) {
            console.error(error);
            document.getElementById('tasksList').innerHTML = '<p>Erreur de chargement</p>';
        }
    }

    function renderPagination() {
        const container = document.getElementById('pagination');
        if (totalPages <= 1) { container.innerHTML = ''; return; }
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="loadTasks(${i})">${i}</button>`;
        }
        container.innerHTML = html;
    }

    async function updateStatus(taskId, newStatus) {
        try {
            await axios.patch(`${API_URL}/tasks/${taskId}/status`, { status: newStatus });
            loadTasks(currentPage);
        } catch (error) { alert('Erreur'); }
    }

    async function createTask() {
        if (!currentProjectId) { alert('Choisissez un projet'); return; }
        const data = {
            title: document.getElementById('taskTitle').value,
            description: document.getElementById('taskDesc').value,
            priority: document.getElementById('taskPriority').value,
            status: document.getElementById('taskStatus').value,
            project: currentProjectId,
            assignedTo: document.getElementById('assignedTo').value || null,
            dueDate: document.getElementById('dueDate').value || null
        };
        if (!data.title) { alert('Titre requis'); return; }
        try {
            await axios.post(`${API_URL}/tasks`, data);
            alert('✅ Tâche créée');
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
            document.getElementById('dueDate').value = '';
            clearDraft();  // 👈 Supprime le brouillon après création
            loadTasks();
        } catch (error) { alert(error.response?.data?.message || 'Erreur'); }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'auth.html';
    }

    document.getElementById('projectSelect').addEventListener('change', async (e) => {
        currentProjectId = e.target.value;
        if (currentProjectId) {
            await loadTasks();
            await loadMembers(currentProjectId);
        } else {
            document.getElementById('tasksList').innerHTML = '<p>Sélectionnez un projet</p>';
            document.getElementById('memberSection').style.display = 'none';
        }
    });

    initDraftAutoSave();  // 👈 Active la sauvegarde automatique
    loadUser();
    loadProjects();
</script>
</body>
</html>
