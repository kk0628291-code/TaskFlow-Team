<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gestion des tâches</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #06090f;
            color: #f1f5f9;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .navbar {
            background: rgba(18,22,35,0.9);
            backdrop-filter: blur(12px);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 24px;
            margin-bottom: 30px;
        }
        .logo h2 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.05);
            padding: 6px 16px 6px 20px;
            border-radius: 40px;
        }
        .logout-btn {
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
        }
        .card {
            background: rgba(18,22,35,0.7);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card h2 { font-size: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            color: #9ca3af;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: #0a0f1a;
            border: 1.5px solid #2d3748;
            border-radius: 16px;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #7c3aed;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .task-item {
            background: rgba(18,22,35,0.7);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .task-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .task-priority {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 10px;
        }
        .priority-haute { background: rgba(239,68,68,0.2); color: #f87171; }
        .priority-moyenne { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .priority-basse { background: rgba(16,185,129,0.2); color: #34d399; }
        .assigned-badge {
            background: rgba(124,58,237,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }
        .task-status { margin-top: 12px; padding: 8px 12px; background: #0a0f1a; border-radius: 12px; display: inline-block; }
        .member-section {
            background: rgba(18,22,35,0.5);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .member-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .member-tag {
            background: #2d3748;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .remove-member { background: none; border: none; color: #f87171; cursor: pointer; }
        .add-member { display: flex; gap: 10px; margin-top: 15px; }
        .add-member input { flex: 1; }
        .add-member button { width: auto; padding: 12px 20px; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 30px; }
        .page-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            color: #9ca3af;
            cursor: pointer;
        }
        .page-btn.active { background: #4f46e5; color: white; }
        .back-link { display: inline-block; margin-top: 20px; color: #a78bfa; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <div class="logo"><h2>TaskFlow</h2></div>
        <div class="user-info">
            <span id="userName">Chargement...</span>
            <button class="logout-btn" onclick="logout()">Déconnexion</button>
        </div>
    </div>

    <div class="card">
        <h2>📁 Sélectionner un projet</h2>
        <select id="projectSelect"><option value="">-- Choisissez un projet --</option></select>
    </div>

    <div id="memberSection" class="member-section" style="display: none;">
        <h3>👥 Membres du projet</h3>
        <div id="membersList" class="member-list"></div>
        <div class="add-member">
            <input type="email" id="inviteEmail" placeholder="Email du membre à inviter">
            <button class="btn-primary" onclick="addMember()">➕ Inviter</button>
        </div>
    </div>

    <div class="card">
        <h2>✨ Nouvelle tâche</h2>
        <div class="form-group"><label>Titre</label><input type="text" id="taskTitle" placeholder="Titre de la tâche"></div>
        <div class="form-group"><label>Description</label><textarea id="taskDesc" rows="3"></textarea></div>
        <div class="form-group"><label>Priorité</label><select id="taskPriority"><option value="basse">Basse</option><option value="moyenne" selected>Moyenne</option><option value="haute">Haute</option></select></div>
        <div class="form-group"><label>Statut</label><select id="taskStatus"><option value="à faire">À faire</option><option value="en cours">En cours</option><option value="terminé">Terminé</option></select></div>
        <div class="form-group"><label>👥 Assigner à</label><select id="assignedTo"><option value="">-- Non assigné --</option></select></div>
        <div class="form-group"><label>Date limite</label><input type="date" id="dueDate"></div>
        <button class="btn-primary" onclick="createTask()">✅ Créer la tâche</button>
        <div id="message" style="margin-top:15px; text-align:center;"></div>
    </div>

    <div class="card">
        <h2>📋 Liste des tâches</h2>
        <div id="tasksList">Chargement...</div>
        <div id="pagination" class="pagination"></div>
    </div>

    <a href="dashboard.html" class="back-link">← Retour au tableau de bord</a>
</div>

<script>
    const API_URL = 'http://localhost:5000/api';
    const token = localStorage.getItem('token');
    const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token) window.location.href = 'auth.html';

    let currentProjectId = null, currentPage = 1, totalPages = 1;

    axios.interceptors.request.use(config => { config.headers.Authorization = `Bearer ${token}`; return config; });

    async function loadUser() {
        try {
            const res = await axios.get(`${API_URL}/auth/me`);
            document.getElementById('userName').textContent = res.data.fullName || res.data.email;
        } catch (error) { localStorage.removeItem('token'); window.location.href = 'auth.html'; }
    }

    async function loadProjects() {
        try {
            const res = await axios.get(`${API_URL}/projects?limit=100`);
            const select = document.getElementById('projectSelect');
            select.innerHTML = '<option value="">-- Choisissez un projet --</option>';
            res.data.data.forEach(p => { const opt = document.createElement('option'); opt.value = p._id; opt.textContent = p.title; select.appendChild(opt); });
        } catch (error) { console.error(error); }
    }

    async function loadMembers(projectId) {
        try {
            const res = await axios.get(`${API_URL}/tasks/projects/${projectId}/members`);
            const data = res.data;
            const isOwner = data.owner && data.owner._id === currentUser.id;
            document.getElementById('memberSection').style.display = isOwner ? 'block' : 'none';
            const assignSelect = document.getElementById('assignedTo');
            assignSelect.innerHTML = '<option value="">-- Non assigné --</option>';
            if (data.owner) assignSelect.appendChild(new Option(`${data.owner.fullName} (Propriétaire)`, data.owner._id));
            data.members.forEach(m => assignSelect.appendChild(new Option(m.fullName, m._id)));
            if (isOwner) {
                const membersList = document.getElementById('membersList');
                membersList.innerHTML = `<div class="member-tag">👑 ${data.owner.fullName} (Propriétaire)</div>`;
                data.members.forEach(m => { membersList.innerHTML += `<div class="member-tag">👤 ${m.fullName}<button class="remove-member" onclick="removeMember('${m._id}')">✕</button></div>`; });
            }
        } catch (error) { console.error(error); }
    }

    async function addMember() {
        const email = document.getElementById('inviteEmail').value.trim();
        if (!email) return alert('Email requis');
        try {
            await axios.post(`${API_URL}/tasks/projects/${currentProjectId}/members`, { email });
            alert('✅ Membre ajouté');
            document.getElementById('inviteEmail').value = '';
            loadMembers(currentProjectId);
        } catch (error) { alert(error.response?.data?.message || 'Erreur'); }
    }

    async function removeMember(memberId) {
        if (!confirm('Retirer ce membre ?')) return;
        try {
            await axios.delete(`${API_URL}/tasks/projects/${currentProjectId}/members/${memberId}`);
            loadMembers(currentProjectId);
        } catch (error) { alert('Erreur lors du retrait'); }
    }

    async function loadTasks(page = 1) {
        if (!currentProjectId) { document.getElementById('tasksList').innerHTML = '<p>Sélectionnez un projet</p>'; document.getElementById('pagination').innerHTML = ''; return; }
        try {
            const res = await axios.get(`${API_URL}/tasks?projectId=${currentProjectId}&page=${page}&limit=5`);
            const tasks = res.data.data;
            totalPages = res.data.totalPages;
            currentPage = res.data.page;
            const container = document.getElementById('tasksList');
            if (!tasks.length) { container.innerHTML = '<p>Aucune tâche dans ce projet</p>'; document.getElementById('pagination').innerHTML = ''; return; }
            container.innerHTML = tasks.map(task => `
                <div class="task-item">
                    <div class="task-title">${escapeHtml(task.title)}</div>
                    <div><span class="task-priority priority-${task.priority}">${task.priority}</span>${task.assignedTo ? `<span class="assigned-badge">👤 ${task.assignedTo.fullName}</span>` : '<span class="assigned-badge">📌 Non assigné</span>'}</div>
                    <p style="margin:10px 0;">${escapeHtml(task.description || 'Pas de description')}</p>
                    <div><select onchange="updateStatus('${task._id}', this.value)" class="task-status"><option value="à faire" ${task.status === 'à faire' ? 'selected' : ''}>À faire</option><option value="en cours" ${task.status === 'en cours' ? 'selected' : ''}>En cours</option><option value="terminé" ${task.status === 'terminé' ? 'selected' : ''}>Terminé</option></select></div>
                    <small style="color:#6b7280;">📅 ${task.dueDate ? new Date(task.dueDate).toLocaleDateString() : 'Pas de date'}</small>
                </div>`).join('');
            renderPagination();
        } catch (error) { console.error(error); document.getElementById('tasksList').innerHTML = '<p>Erreur de chargement</p>'; }
    }

    function renderPagination() {
        const container = document.getElementById('pagination');
        if (totalPages <= 1) { container.innerHTML = ''; return; }
        let html = '';
        for (let i = 1; i <= totalPages; i++) html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="loadTasks(${i})">${i}</button>`;
        container.innerHTML = html;
    }

    async function updateStatus(taskId, newStatus) {
        try {
            await axios.patch(`${API_URL}/tasks/${taskId}/status`, { status: newStatus });
            loadTasks(currentPage);
            showMessage('Statut mis à jour', 'success');
        } catch (error) { showMessage(error.response?.data?.message || 'Erreur', 'error'); }
    }

    async function createTask() {
        if (!currentProjectId) { showMessage('Veuillez choisir un projet', 'error'); return; }
        const taskData = {
            title: document.getElementById('taskTitle').value,
            description: document.getElementById('taskDesc').value,
            priority: document.getElementById('taskPriority').value,
            status: document.getElementById('taskStatus').value,
            project: currentProjectId,
            assignedTo: document.getElementById('assignedTo').value || null,
            dueDate: document.getElementById('dueDate').value || null
        };
        if (!taskData.title) { showMessage('Le titre est requis', 'error'); return; }
        try {
            await axios.post(`${API_URL}/tasks`, taskData);
            showMessage('✅ Tâche créée avec succès', 'success');
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
            document.getElementById('dueDate').value = '';
            loadTasks();
        } catch (error) { showMessage(error.response?.data?.message || 'Erreur', 'error'); }
    }

    function showMessage(msg, type) {
        const div = document.getElementById('message');
        div.textContent = msg;
        div.style.color = type === 'success' ? '#34d399' : '#f87171';
        setTimeout(() => div.textContent = '', 3000);
    }

    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = 'auth.html'; }

    document.getElementById('projectSelect').addEventListener('change', (e) => {
        currentProjectId = e.target.value;
        if (currentProjectId) { loadTasks(); loadMembers(currentProjectId); }
        else { document.getElementById('tasksList').innerHTML = '<p>Sélectionnez un projet</p>'; document.getElementById('memberSection').style.display = 'none'; }
    });

    loadUser();
    loadProjects();
</script>
</body>
</html>
